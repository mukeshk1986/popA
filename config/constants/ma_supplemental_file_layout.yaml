# MA Supplemental File Layout Configuration
# Detailed field layout specifications for Medicare Advantage (MA) supplemental files
# This configuration defines the structure, column positions, and field mappings
# for MAO_004 and MMR supplemental data files

# ================================
# MAO_004 File Configuration
# ================================
# Medicare Advantage Encounter (MAO) supplemental file structure

files:
  MAO_004:
    description: "Medicare Advantage Encounter supplemental file"
    file_type: "MAO_004"
    parse_function: "parse_mao_004_files"
    target_tables:
      - "medicare_mao_header"
      - "medicare_mao"
      - "medicare_mao_trailer"

    # ================================
    # MAO Header Record Layout
    # ================================
    tables:
      medicare_mao_header:
        description: "MAO file header record"
        record_type: "H"
        identifier:
          columns:
            - name: "RECORD_TYPE"
              start: 0
              end: 1
              description: "Record type indicator (H = Header)"

        columns:
          - name: "RECORD_TYPE"
            start: 0
            end: 1
            type: "string"
            description: "Record type indicator"

          - name: "REPORT_ID"
            start: 1
            end: 9
            type: "string"
            description: "Report identifier"

          - name: "CONTRACT_ID"
            start: 9
            end: 15
            type: "string"
            description: "Medicare contract ID"

          - name: "REPORT_DATE"
            start: 15
            end: 23
            type: "date"
            description: "Report date (YYYYMMDD)"

          - name: "REPORT_DESC"
            start: 23
            end: 33
            type: "string"
            description: "Report description"

          - name: "SUB_FILE_TYPE"
            start: 110
            end: 114
            type: "string"
            description: "Submitter file type"

          - name: "PHASE"
            start: 114
            end: 116
            type: "string"
            description: "File transmission phase"

          - name: "VERSION"
            start: 116
            end: 118
            type: "integer"
            description: "File format version"

      # ================================
      # MAO Detail Record Layout
      # ================================
      medicare_mao:
        description: "MAO encounter detail record"
        record_type: "D"
        identifier:
          columns:
            - name: "RECORD_TYPE"
              start: 0
              end: 1
