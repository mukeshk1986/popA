  - gm_acted3j_duri0pi

  # Drug duration with PBD (Pharmacy Benefits Data) flags
  - g1_lte5_duri_9_nd_pbd
  - g1_lte5_duri_9_fbd
  - g1_lte5_duri0pi_nd_pbd
  - g1_lte5_duri0pi_fbd
