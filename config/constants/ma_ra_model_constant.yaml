# ================================
# MA Reference Models
# ================================
# Reference models for Medicare Advantage validation and lookups
MA_REFERENCE:
  - ma_reference

# ================================
# Model Categories Summary
# ================================
# This organizes all models by their primary use cases
MODEL_CATEGORIES:
  demographics:
    description: "Demographic-based risk models"
    models: DEMO_MODELS

  transplant:
    description: "Organ transplant-specific risk models"
    models: TRANSPLANT_MODELS

  drug_therapy:
    description: "Medication therapy-based risk models"
    models: DRUG_THERAPY_MODELS

  lti:
    description: "Long-term institutional care risk models"
    models: LTI_MODELS

  dme:
    description: "Durable medical equipment risk models"
    models: DME_MODELS

  diagnosis:
    description: "SEDITS diagnosis code sets for condition identification"
    sets:
      - SEDITS_DIAG1
      - SEDITS_DIAG2
      - SEDITS_DIAG3
      - SEDITS_DIAG4
      - SEDITS_DIAG5

  reference:
    description: "Reference data for MA validation"
    models: MA_REFERENCE
