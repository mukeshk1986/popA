# Data Loader Configuration
# This configuration file defines the schema, file locations, and column mappings
# for the CMS Population Health data pipeline

catalog: pop_{env}
source_schema: "{plan_name}ingestion"
target_schema: "{plan_name}transformation"

# ================================
# Base Directory Configuration
# ================================
# Base for all files lookups
src_file_dir: /Volumes/pop_{env}/volumes/bhi-pop-{env}-datalake-{plan_name}inbox-us-east-1

# Base for all files lookups
ingestion_file_dir: /Volumes/pop_{env}/{plan_name}ingestion/ingestion/src_files

# Base for archiving files
archive_dir: /Volumes/pop_{env}/{plan_name}ingestion/ingestion/archive

# ================================
# File Names Configuration
# ================================
# All the valid filenames to be processed
file_names:
  - facility_detail
  - facility_diag
  - facility_header
  - member
  - member_enrollee_history
  - member_enrollment
  - pharmacy
  - professional
  - professional_diag
  - diagnosis_diag
  - quality_events
  - lab
  - designated_provider
  - provider
  - location
  - health_events
  - mmr
  - mao_004

# Supplemental file list
supplemental_file_names:
  - mao_004
  - mmr

# ================================
# Merge Keys Configuration
# ================================
# Merge keys for the non-supplemental tables in ra_transformation
merge_keys:
  facility_detail: "HCME_PLAN_ID_CD,HCME_ID_CD"
  facility_diag: "HCME_PLAN_ID_CD,HCME_ID_CD,DIAG_TYPE_CD,DIAG_NUMB"
  facility_header: "CLIM_ID_CD,HCME_PLAN_ID_CD"
  member_enrollee_history: "HCME_PLAN_ID_CD,MEMB_ID_CD,BHI_MEMB_ID"
  member: "HCME_PLAN_ID_CD"
  professional: "CLIM_ID_CD,CLIM_LN_NUMB,HCME_PLAN_ID_CD"
  professional_diag: "CLIM_ID_CD,HCME_PLAN_ID_CD,DIAG_TYPE_CD,DIAG_NUMB"
  pharmacy: "CLIM_ID_CD,CLIM_LN_NUMB,HCME_PLAN_ID_CD"

# ================================
# Filename Matching Configuration
# ================================
file_types:
  facility_diag:
    standardised_name: "FACILITY_DIAGNOSIS"
  professional_diag:
    standardised_name: "PROFESSIONAL_DIAGNOSIS"
  lab:
    standardised_name: "LAB_RESULTS"

# ================================
# Pattern Matching for Supplemental Files
# ================================
special_files:
  mao_004:
    pattern: "[MAO004PU]"
  mmr:
    pattern: "[MCMMEMD]"

MAO_FILE_TYPE: "mao_supplemental_dx"

# ================================
# Delta Share Configuration
# ================================
delta_share_config:
  schema: atomic

# ================================
